# deedroll on Cloudflare Workers. Build the assets first: node scripts/build-site.js
#
# Home: https://deedroll.antharmaya.com (custom domain; Cloudflare creates the DNS record and
# certificate). The project was called mcpscan until 2026-10-02. mcpscan.antharmaya.com and
# mcpscan.harshavar968.workers.dev stay on, because links already sent point at them: the Worker
# sends their GETs to the canonical host with a 301.
#
# The Worker and the R2 bucket keep their mcpscan names: renaming them means a new Worker and
# copying the bucket, and no visitor ever sees either name.
name = "mcpscan"
main = "deploy/worker.js"
compatibility_date = "2026-09-28"
routes = [
  { pattern = "deedroll.antharmaya.com", custom_domain = true },
  { pattern = "mcpscan.antharmaya.com", custom_domain = true },
]
workers_dev = true

[vars]
CANONICAL_HOST = "deedroll.antharmaya.com"
# Empty until 2026-10-04: some resolvers (Jio's, seen 2026-10-02) cached "no such name" for
# deedroll.antharmaya.com from the minutes before it existed, so a redirect there would break the
# old address for their users. Until then mcpscan.antharmaya.com serves the site itself. Set it
# back to "mcpscan.antharmaya.com" to turn the 301 on.
FORMER_HOSTS = ""

[assets]
directory = "./site"
binding = "ASSETS"
# Every request runs the Worker first, so the workers.dev redirect also covers /web/* pages.
run_worker_first = true

[[r2_buckets]]
binding = "HISTORY"
bucket_name = "mcpscan-history"

[[ratelimits]]
name = "PROBE_LIMIT"
namespace_id = "7301"

[ratelimits.simple]
limit = 20
period = 60

[observability]
enabled = true
