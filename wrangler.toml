# mcpscan on Cloudflare Workers. Build the assets first: node scripts/build-site.js
#
# Home: https://mcpscan.antharmaya.com (custom domain; Cloudflare creates the DNS record and
# certificate). The old mcpscan.harshavar968.workers.dev stays on, because links already sent
# point at it: the Worker sends its GETs to the canonical host with a 301.
name = "mcpscan"
main = "deploy/worker.js"
compatibility_date = "2026-09-28"
routes = [{ pattern = "mcpscan.antharmaya.com", custom_domain = true }]
workers_dev = true

[vars]
CANONICAL_HOST = "mcpscan.antharmaya.com"

[assets]
directory = "./site"
binding = "ASSETS"
# Every request runs the Worker first, so the workers.dev redirect also covers /web/* pages.
run_worker_first = true

[[r2_buckets]]
binding = "HISTORY"
bucket_name = "mcpscan-history"

[[ratelimits]]
name = "PROBE_LIMIT"
namespace_id = "7301"

[ratelimits.simple]
limit = 20
period = 60

[observability]
enabled = true
