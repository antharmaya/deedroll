# mcpscan on Cloudflare Workers. Build the assets first: node scripts/build-site.js
#
# Temporary home: mcpscan.harshavar968.workers.dev, until GitHub and npm access are back.
# The move to an Antharmaya subdomain is this block, uncommented (the zone must be on this
# Cloudflare account), then `npx wrangler deploy`:
#
# routes = [{ pattern = "mcpscan.antharmaya.com", custom_domain = true }]
# workers_dev = false   # only once the custom domain answers
name = "mcpscan"
main = "deploy/worker.js"
compatibility_date = "2026-09-28"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/", "/api/*", "/history/*"]

[[r2_buckets]]
binding = "HISTORY"
bucket_name = "mcpscan-history"

[[ratelimits]]
name = "PROBE_LIMIT"
namespace_id = "7301"

[ratelimits.simple]
limit = 20
period = 60

[observability]
enabled = true
